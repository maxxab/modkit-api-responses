[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "modkit-api-responses"
version = "0.1.0"
description = "Configurable response envelopes and finalized-byte conditional reads"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
[project.optional-dependencies]
pydantic = ["pydantic>=2.14,<3"]
fastapi = ["fastapi>=0.162,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
modkit_api_responses = ["py.typed"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
